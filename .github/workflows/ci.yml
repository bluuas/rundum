name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Placeholder values: every route is server-rendered on demand, so the
      # build never talks to Supabase. They exist because the modules read the
      # variables at import time, and a build that fails for want of a string
      # tells you nothing about the code.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

  e2e:
    name: Browser and database tests
    runs-on: ubuntu-latest
    # No secrets and no opt-in: the whole database runs here in Docker, so a
    # fork gets the same green tick, and a bad merge cannot reach a deployment.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start the local Supabase stack
        run: npx supabase start

      - name: Point the app at it
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "ALLOW_MOCK_AUTH=true"
            # Against the local stand-in, never real Strava. Hitting Strava
            # from CI would be exactly the kind of automated traffic the API
            # terms forbid.
            echo "STRAVA_AUTH_BASE_URL=http://localhost:4400"
            echo "STRAVA_CLIENT_ID=fake-client-id"
            echo "STRAVA_CLIENT_SECRET=fake-client-secret"
            echo "STRAVA_REDIRECT_URI=http://localhost:3000/api/auth/strava/callback"
          } > .env.local

      - name: Seed demo data
        run: npm run db:seed

      - name: Check the security boundaries
        run: npm run db:verify

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
