name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Placeholder values: every route is server-rendered on demand, so the
      # build never talks to Supabase. They exist because the modules read the
      # variables at import time, and a build that fails for want of a string
      # tells you nothing about the code.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

  e2e:
    name: Browser and database tests
    runs-on: ubuntu-latest
    # These need a real Supabase project, so they are opt-in: set the repository
    # variable RUN_E2E to "true" and add the three secrets below. Without them
    # the job is skipped rather than failing, so a fork's CI still goes green.
    if: ${{ vars.RUN_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Reset demo data
        run: npm run db:seed
        env:
          SEED_CONFIRM_REMOTE: 'yes'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check the security boundaries
        run: npm run db:verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Playwright
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_MOCK_AUTH: 'true'
          # Against the local stand-in, never real Strava. Hitting Strava from
          # CI would be exactly the kind of automated traffic the API terms
          # forbid.
          STRAVA_AUTH_BASE_URL: http://localhost:4400
          STRAVA_CLIENT_ID: fake-client-id
          STRAVA_CLIENT_SECRET: fake-client-secret
          STRAVA_REDIRECT_URI: http://localhost:3000/api/auth/strava/callback

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
